aid: polychain
name: Polychain Capital
description: >-
  Polychain Capital is a San Francisco-based investment firm founded in 2016 by Olaf Carlson-Wee, the
  first employee and former Head of Risk at Coinbase. The firm is dedicated exclusively to blockchain and
  cryptocurrency, investing in protocols, digital tokens, and early-stage crypto companies through both a
  liquid token hedge fund and dedicated venture capital vehicles. Polychain's thesis centers on digital
  assets whose scarcity derives from mathematical and cryptographic properties, and its portfolio spans
  layer-1 and layer-2 networks, DeFi, developer and cryptographic infrastructure, custody, exchanges,
  zero-knowledge and privacy technology, AI-native crypto, and stablecoins. The firm has led notable
  rounds including Uniswap, dYdX, Yellow Card, Arbitrum (Offchain Labs), Scroll, and EigenLayer, and its
  venture funds are backed by LPs including Andreessen Horowitz, Sequoia Capital, Union Square Ventures,
  and Founders Fund. Reported assets under management have ranged from roughly $2.6B to about $5B across
  its funds; Polychain closed a $200M fourth venture fund in 2023 and employs a team of roughly 32 people
  from its San Francisco headquarters.
